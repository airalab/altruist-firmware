name: Upload Binaries to Update Server
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build Stable release firmware
        env:
          ALTRUIST_CHANNEL_TESTING: '0'
          ALTRUIST_HEALTH_TELEMETRY: '1'
          ALTRUIST_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          pio run -e esp32c6_urban_en -e esp32c6_urban_ru -e esp32c6_inside_en -e esp32c6_inside_ru -e esp32c3_urban_en -e esp32c3_urban_ru

      - name: Upload to FTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local_path: ./builds/*.bin*
          remote_path: /home/updsens/web/upd.sensors.robonomics.network/public_html/pre_release/
          port: 22
