name: Redeploy OTA server from webflasher

# Manual trigger: re-runs the OTA server update without rebuilding the
# firmware. On the server it syncs ~/htdocs/webflasher to origin/main, creates
# today's dated snapshot dirs and repoints the `latest` symlinks. Use it to
# retry a failed OTA rotation or to re-deploy after fixing something by hand.
# To roll back to an older snapshot, ssh in and run
#   ln -sfn <previous_snapshot>/ latest
# inside the affected channel dir (insight/esp32c6, urban/esp32c3, urban/esp32c6).

on:
  workflow_dispatch: {}

concurrency:
  group: altruist-ota-deployment
  cancel-in-progress: false

jobs:
  redeploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout altruist-firmware
        uses: actions/checkout@v4

      - name: Rotate stable firmware on the OTA update server
        uses: ./.github/actions/deploy-ota
        with:
          ssh-host: ${{ secrets.OTA_SSH_HOST }}
          ssh-user: ${{ secrets.OTA_SSH_USER }}
          ssh-key: ${{ secrets.OTA_SSH_KEY }}
