debug_tool = ${esp32c3_debug_profile.debug_tool}
debug_init_break = ${esp32c3_debug_profile.debug_init_break}

[env:esp32c6_urban_en]
custom_esp_target = esp32c6
custom_model = urban
custom_language = en
custom_publish_artifacts = yes
board = ${esp32c6.board}
build_flags =
	${common.build_flags_esp32_release}
	${esp32c6_urban.build_flags}
	${proto_protocol.build_flags}
	${language_en.build_flags}
lib_deps = ${esp32c6_urban.lib_deps}
board_build.partitions = ${esp32c6.board_build.partitions}

[env:esp32c6_urban_en_debug]
custom_esp_target = esp32c6
custom_model = urban
custom_language = en
custom_publish_artifacts = no
board = ${esp32c6.board}
build_type = debug
build_flags =
	${debug_profile.build_flags}
	${esp32c6_urban.build_flags}
	${language_en.build_flags}
	; Optional one-shot: force-clear rws_devices_registered_hash on every boot
	; "-DALTRUIST_RWS_RESET_REGISTRATION=1"
lib_deps = ${esp32c6_urban.lib_deps}
board_build.partitions = ${esp32c6.board_build.partitions}
debug_tool = ${debug_profile.debug_tool}
debug_init_break = ${debug_profile.debug_init_break}

