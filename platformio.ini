; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .
build_dir = ./builds

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31/platform-espressif32.zip
framework = arduino
extra_scripts =
	pre:platformio_build_metadata.py
	${common.extra_scripts}
build_src_filter = +<*> -<apis/helpers/proto/generated/> -<.tools/>

[common]
build_flags_core =
	-DVTABLES_IN_FLASH -D BEARSSL_SSL_BASIC
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
	-D HTTPCLIENT_1_1_COMPATIBLE=0
	-DFP_IN_IROM -frandom-seed=b61f78373
build_flags_zmod =
	-Isensors/drivers/zmod4510/include
	-Isensors/drivers/zmod4510/hal
	-Lsensors/drivers/zmod4510/lib
build_flags =
	${common.build_flags_core}
	${common.build_flags_zmod}
build_flags_esp32 =
	${common.build_flags}
	-DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
	-DVTABLES_IN_FLASH -DBEARSSL_SSL_BASIC
	-DROBONOMICS_USE_HTTP
	-UROBONOMICS_USE_WS
	-l_no2_o3
	-l_zmod4xxx_cleaning
build_flags_esp32_release =
	${common.build_flags_esp32}
	-DNDEBUG
	-DCORE_DEBUG_LEVEL=0
build_flags_esp32_debug =
	${common.build_flags_esp32}
	-g
	-Og
	-fno-inline
	-DUSING_JTAG_DEBUGGER_PINS=1
	-DDEBUG_ESP_PORT=Serial
	-DCORE_DEBUG_LEVEL=4
	-DALTRUIST_BUILD_DEBUG
	-DALTRUIST_HEALTH_TELEMETRY
board_build.ldscript = eagle.flash.4m3m.ld
board_build.filesystem = spiffs
board_build.f_cpu = 160000000L
lib_deps_external_inside = 
	bblanchon/ArduinoJson@6.18.3
	mikalhart/TinyGPSPlus@1.0.2
	https://github.com/airalab/esp-robonomics-client
	https://github.com/ricmoo/QRCode
	adafruit/Adafruit NeoPixel
	nanopb/nanopb@0.4.9
lib_deps_external_urban = 
	bblanchon/ArduinoJson@6.18.3
	mikalhart/TinyGPSPlus@1.0.2
	https://github.com/airalab/esp-robonomics-client
	https://github.com/ricmoo/QRCode
; C3 Urban flash budget: no GPS lib, optional sensors compiled out via build_src_filter
lib_deps_external_urban_c3 = 
	bblanchon/ArduinoJson@6.18.3
	https://github.com/airalab/esp-robonomics-client
	https://github.com/ricmoo/QRCode
build_flags_esp32_c3_urban =
	${common.build_flags_core}
	-DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
	-DVTABLES_IN_FLASH -DBEARSSL_SSL_BASIC
	-DROBONOMICS_USE_HTTP
	-UROBONOMICS_USE_WS
	-DALTRUIST_URBAN_C3_LITE
	-DALTRUIST_URBAN_C3_NO_MDNS
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
	-Wl,-s
build_src_filter_esp32c3_urban =
	+<*>
	-<apis/helpers/proto/generated/>
	-<.tools/>
	-<buttons/>
	-<leds/leds_controller_urban.cpp>
	-<display/>
	-<sensors/zmod4510_sensor.cpp>
	-<sensors/ags3871_sensor.cpp>
	-<sensors/tiny_gps_sensor.cpp>
	-<sensors/drivers/ags3871/>
	-<sensors/drivers/zmod4510/>
	-<DHT.cpp>
	-<sd_card/>
lib_deps_external_urban_hw = 
	${common.lib_deps_external_urban}
	adafruit/Adafruit NeoPixel
	nanopb/nanopb@0.4.9
lib_deps_esp8266_platform = 
	Hash
	Wire
	ESP8266WiFi
	DNSServer
	ESP8266HTTPClient
	ESP8266WebServer
	ESP8266mDNS
	EspSoftwareSerial
lib_deps_esp32_platform = 
	WiFi
	DNSServer
	WiFiClientSecure
	HTTPClient
	FS
	SPIFFS
	WebServer
	Update
	ESPmDNS
; C3 Urban flash budget: no mDNS — open by LAN IP; Insight pairs via custom Urban IP
lib_deps_esp32_c3_platform =
	WiFi
	DNSServer
	WiFiClientSecure
	HTTPClient
	FS
	SPIFFS
	WebServer
	Update
lib_deps_urban = ${common.lib_deps_esp32_platform} ${common.lib_deps_external_urban}
lib_deps_inside = ${common.lib_deps_esp32_platform} ${common.lib_deps_external_inside}
extra_scripts = platformio_script.py
platform_version = espressif8266@2.6.2
platform_version_esp32 = platformio/espressif32 

[language_en]
build_flags = -DINTL_EN

[language_ru]
build_flags = -DINTL_RU

[esp32c3_urban]
board = esp32-c3-devkitm-1
build_flags =
	${common.build_flags_esp32_c3_urban}
	-DKIT_C
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DALTRUIST_URBAN
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32c3/include/esp_eth/include
lib_deps = ${common.lib_deps_esp32_c3_platform} ${common.lib_deps_external_urban_c3}
lib_ignore =
	WebSockets
	ESPmDNS
build_src_filter = ${common.build_src_filter_esp32c3_urban}
board_build.partitions = esp32c3_partitions.csv

[esp32c6]
board = esp32-c6-devkitc-1
build_flags =
	-DKIT_C
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
board_build.partitions = esp32c6_partitions.csv

[esp32c6_urban]
build_flags =
	${esp32c6.build_flags}
	-DALTRUIST_URBAN
	-DALTRUIST_URBAN_HW_UI
lib_deps = ${common.lib_deps_esp32_platform} ${common.lib_deps_external_urban_hw}

[esp32c6_inside]
build_flags =
	${esp32c6.build_flags}
	-DALTRUIST_INSIGHT
	; Temporary compatibility alias for code and dependencies using the old name.
	-DALTRUIST_INSIDE
	-DDISPLAY_4IN2
	-DUSE_SD_CARD
lib_deps = ${common.lib_deps_inside}

; C6 Urban + Insight (release and debug). Not C3 — flash budget.
[proto_protocol]
build_flags =
	-DALTRUIST_PROTO_PROTOCOL
	-Iapis/helpers/proto/generated

[debug_profile]
build_flags =
	${common.build_flags_esp32_debug}
	-DALTRUIST_DEFAULT_LOG_LEVEL=4
	-DALTRUIST_FORCE_LOG_LEVEL=4
	${proto_protocol.build_flags}
debug_tool = esp-builtin
debug_init_break = tbreak setup

; C3 app slot is 0x1B0000. -Og/-fno-inline and PIO build_type=debug overflow it
; (~100.7%). Keep verbose logs; size-optimize like release. Full -Og JTAG is C6.
[esp32c3_debug_profile]
build_flags =
	${esp32c3_urban.build_flags}
	-g
	-DUSING_JTAG_DEBUGGER_PINS=1
	-DDEBUG_ESP_PORT=Serial
	-DCORE_DEBUG_LEVEL=4
	-DALTRUIST_BUILD_DEBUG
	-DALTRUIST_HEALTH_TELEMETRY
	-DALTRUIST_DEFAULT_LOG_LEVEL=4
	-DALTRUIST_FORCE_LOG_LEVEL=4
debug_tool = esp-builtin
debug_init_break = tbreak setup

[env:esp32c3_urban_en]
custom_esp_target = esp32c3
custom_model = urban
custom_language = en
custom_publish_artifacts = yes
board = ${esp32c3_urban.board}
build_flags =
	${esp32c3_urban.build_flags}
	-DNDEBUG
	-DCORE_DEBUG_LEVEL=0
	${language_en.build_flags}
lib_deps = ${esp32c3_urban.lib_deps}
lib_ignore = ${esp32c3_urban.lib_ignore}
build_src_filter = ${esp32c3_urban.build_src_filter}
board_build.partitions = ${esp32c3_urban.board_build.partitions}

[env:esp32c3_urban_en_debug]
custom_esp_target = esp32c3
custom_model = urban
custom_language = en
custom_publish_artifacts = no
board = ${esp32c3_urban.board}
build_flags =
	${esp32c3_debug_profile.build_flags}
	${language_en.build_flags}
lib_deps = ${esp32c3_urban.lib_deps}
lib_ignore = ${esp32c3_urban.lib_ignore}
build_src_filter = ${esp32c3_urban.build_src_filter}
board_build.partitions = ${esp32c3_urban.board_build.partitions}
debug_tool = ${esp32c3_debug_profile.debug_tool}
debug_init_break = ${esp32c3_debug_profile.debug_init_break}

[env:esp32c3_urban_ru]
custom_esp_target = esp32c3
custom_model = urban
custom_language = ru
custom_publish_artifacts = yes
board = ${esp32c3_urban.board}
build_flags =
	${esp32c3_urban.build_flags}
